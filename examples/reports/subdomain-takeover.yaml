# Fictional example: dangling CNAME on an in-scope subdomain (example.com data only).
title: "Subdomain takeover of status-old.example.com via unclaimed object-storage bucket"
asset: "status-old.example.com"
vuln_class: "Subdomain Takeover (CWE-1394)"
program: example-corp
summary: >-
  status-old.example.com has a CNAME pointing to a cloud storage website endpoint whose bucket
  no longer exists. Anyone can register the bucket name and serve arbitrary content from the
  example.com domain.
steps:
  - "Run `dig CNAME status-old.example.com` and note it points to `example-status.storage.example.net`."
  - "Request `https://status-old.example.com/` and observe the provider's 'NoSuchBucket' error page."
  - "Register a bucket named `example-status` in the provider console (only a harmless `poc.txt` containing the researcher's handle was uploaded)."
  - "Request `https://status-old.example.com/poc.txt` and observe the uploaded content served from the example.com hostname."
  - "The test file was removed and the bucket released after verification."
impact: >-
  An attacker could host phishing pages or malicious scripts on a trusted example.com
  subdomain, and could set cookies scoped to `.example.com` if the cookie policy allows it.
severity: medium
remediation: >-
  Remove the dangling DNS record, or recreate and lock down the bucket. Audit DNS regularly
  for CNAMEs pointing at deprovisioned resources.
references:
  - "https://owasp.org/www-project-web-security-testing-guide/"
